name: Linux Build & Test CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-and-build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies (mpv / libmpv)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev mpv binutils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
        run: |
          pytest -v

      - name: Build Linux Executable (build.py)
        run: |
          python build.py --platform=linux

      - name: Verify Built Linux Executable
        run: |
          ./dist/linux/ymusic --help
          ./dist/linux/ymusic --version

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ymusic-linux-x64
          path: dist/linux/ymusic
          retention-days: 7
