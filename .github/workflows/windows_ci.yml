name: Windows Build & Test CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-and-build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
        run: |
          pytest -v

      - name: Test Windows mpv Auto-Download on Windows Runner
        env:
          PYTHONPATH: src
        run: |
          python -c "from ymusic_cli.mpv_windows import ensure_mpv_windows, find_existing_mpv_dll; print('Initial find:', find_existing_mpv_dll()); assert ensure_mpv_windows(auto_download=True), 'Auto-download failed'; print('After download find:', find_existing_mpv_dll()); import mpv; print('Successfully loaded mpv module in Windows VM!')"

      - name: Build Windows Executable (build.py)
        run: |
          python build.py

      - name: Verify Built Windows Executable
        run: |
          .\dist\ymusic.exe --help
          .\dist\ymusic.exe --version

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ymusic-windows-x64
          path: dist/ymusic.exe
          retention-days: 7
