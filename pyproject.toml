[project]
name = "ymusic-cli"
version = "0.2.0"
description = "Console player for Yandex Music"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-mpv>=1.0.8",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.38",
    "yandex-music>=3.0.0",
    "requests>=2.28.0",
    "colorama>=0.4.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ymusic = "ymusic_cli.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["Ycli*", ".venv", "build", "dist"]

